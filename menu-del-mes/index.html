<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6a3c">
<title>Menú del Mes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Elige tu supermercado, dinos cuántos sois y te preparamos el menú de todo el mes con la lista de la compra más barata.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@60..130,500..900&family=Figtree:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: cabecera fija con pestañas; debajo una columna central. El menú va por semanas de compra,
   la lista de la compra se lee como un ticket y los precios como etiquetas amarillas de lineal. */
:root {
  --paper: #f3f5ef; --surface: #ffffff; --surface-2: #eaeee5; --ink: #18211b; --muted: #5a675d; --line: #d9dfd3;
  --leaf: #2b6a3c; --leaf-ink: #ffffff; --leaf-soft: #e1eedf;
  --tag: #ffd93b; --tag-ink: #1b1a10; --red: #c8382a; --receipt: #fffef7; --receipt-line: #c9c6b4;
  --shadow: 0 1px 2px rgba(24, 40, 28, .06), 0 10px 30px rgba(24, 40, 28, .07);
  --f-display: "Anybody", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101511; --surface: #182019; --surface-2: #1f2920; --ink: #e8eee6; --muted: #9caa9f; --line: #2b372d;
    --leaf: #7fc58d; --leaf-ink: #0d1a10; --leaf-soft: #1d3223;
    --tag: #f4cf35; --tag-ink: #17150a; --red: #ff7d6b; --receipt: #1b221c; --receipt-line: #3a453b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101511; --surface: #182019; --surface-2: #1f2920; --ink: #e8eee6; --muted: #9caa9f; --line: #2b372d;
  --leaf: #7fc58d; --leaf-ink: #0d1a10; --leaf-soft: #1d3223;
  --tag: #f4cf35; --tag-ink: #17150a; --red: #ff7d6b; --receipt: #1b221c; --receipt-line: #3a453b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 78%; font-weight: 850; line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.logo { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.logo b { font-family: var(--f-display); font-stretch: 70%; font-weight: 900; font-size: 26px; letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; }
.logo b span { color: var(--leaf); }
@media (max-width: 600px) { .who { display: none; } }
.who { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 99px; transition: background .15s, color .15s; }
.tabs a:hover { color: var(--ink); background: var(--surface-2); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }

main { padding-block: 24px 80px; }
.view[hidden] { display: none; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; padding: 10px 16px; border-radius: 999px; text-decoration: none; transition: transform .1s, background .15s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn--go { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
.btn--go:hover { background: var(--leaf); filter: brightness(1.06); }
.btn--big { padding: 14px 22px; font-size: 16px; }
.btn--small { padding: 6px 12px; font-size: 13px; }

/* Etiqueta de precio tipo lineal */
.tag { display: inline-flex; flex-direction: column; align-items: flex-end; background: var(--tag); color: var(--tag-ink); border-radius: 4px; padding: 3px 7px 2px; line-height: 1; font-variant-numeric: tabular-nums; flex: none; }
.tag b { font-family: var(--f-display); font-stretch: 80%; font-weight: 850; font-size: 16px; }
.tag small { font-size: 9.5px; font-weight: 600; letter-spacing: .02em; margin-top: 2px; opacity: .8; }
.tag--big b { font-size: 34px; }
.tag--big { padding: 8px 12px 6px; border-radius: 6px; }

/* Aviso de ejemplo */
.note { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--leaf-soft); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 22px; }
.note p { min-width: 0; flex: 1 1 280px; }

/* Cabecera de vista */
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.vhead h1 { font-size: clamp(32px, 6vw, 52px); text-transform: uppercase; }
.vhead p { margin-top: 6px; color: var(--muted); }
.vhead__side { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Menú */
.week { margin-bottom: 30px; }
.week__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
.week__head h2 { font-size: 24px; text-transform: uppercase; }
.week__head a { color: var(--leaf); font-weight: 600; font-size: 14px; text-decoration: none; }
.week__head a:hover { text-decoration: underline; }
.day { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.day--today .day__date b { background: var(--leaf); color: var(--leaf-ink); }
.day__date { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; }
.day__date span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.day__date b { font-family: var(--f-display); font-stretch: 80%; font-size: 24px; font-weight: 850; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day__meals { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-width: 0; }
.day__meals--nob { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.meal { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 10px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.meal:hover { border-color: var(--leaf); box-shadow: var(--shadow); }
.meal__t { min-width: 0; }
.meal__k { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.meal__n { display: block; font-weight: 600; font-size: 14px; line-height: 1.3; }
.meal--b { background: transparent; }
.meal--b .meal__n { font-weight: 500; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) {
  .day { grid-template-columns: 48px 1fr; gap: 10px; }
  .day__date b { width: 36px; height: 36px; font-size: 20px; }
  .day__meals, .day__meals--nob { grid-template-columns: minmax(0, 1fr); gap: 6px; }
}

/* Lista de la compra */
.trips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; scrollbar-width: thin; }
.trip { flex: none; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; min-width: 150px; }
.trip b { font-size: 14px; }
.trip span { font-size: 12.5px; color: var(--muted); }
.trip i { font-style: normal; font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.trip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.trip[aria-pressed="true"] span { color: inherit; opacity: .75; }
.shop { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .shop { grid-template-columns: minmax(0, 1fr); } }
.receipt { background: var(--receipt); border-radius: 4px; box-shadow: var(--shadow); padding: 22px clamp(14px, 3vw, 28px) 26px; font-family: var(--f-mono); position: relative; min-width: 0; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 9px; background: linear-gradient(-45deg, transparent 6px, var(--receipt) 0) 0 0 / 12px 9px repeat-x, linear-gradient(45deg, transparent 6px, var(--receipt) 0) 0 0 / 12px 9px repeat-x; }
.receipt__head { text-align: center; border-bottom: 1px dashed var(--receipt-line); padding-bottom: 12px; margin-bottom: 6px; }
.receipt__head b { display: block; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.receipt__head span { font-size: 13px; color: var(--muted); }
.sec { margin-top: 14px; }
.sec h3 { font-family: var(--f-mono); font-stretch: 100%; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding-bottom: 4px; border-bottom: 1px dashed var(--receipt-line); }
.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dotted var(--receipt-line); cursor: pointer; }
.item input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--leaf); cursor: pointer; }
.item__n, .item__d { display: block; }
.item__n { font-size: 14px; font-weight: 700; line-height: 1.3; }
.item__d { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.item__p { font-size: 14px; font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item__p small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.item.is-done .item__n, .item.is-done .item__p { text-decoration: line-through; opacity: .5; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); margin-top: 16px; padding-top: 10px; font-size: 20px; font-weight: 700; }
.receipt__foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.aside { display: grid; gap: 14px; position: sticky; top: 120px; }
@media (max-width: 860px) { .aside { position: static; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.card h3 { font-size: 18px; text-transform: uppercase; }
.card p { font-size: 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--leaf); border-radius: inherit; transition: width .3s; }
.copybox { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px; }

/* Resumen */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
@media (max-width: 640px) { .stats { grid-template-columns: minmax(0, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; }
.stat > span:not(.tag) { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat .tag { justify-self: start; align-items: flex-start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 20px; }
.panel h2 { font-size: 24px; text-transform: uppercase; margin-bottom: 4px; }
.panel > p { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 14px; }
.bar__track { height: 22px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar__fill { height: 100%; background: var(--muted); opacity: .45; border-radius: 5px; }
.bar.is-me .bar__fill { background: var(--leaf); opacity: 1; }
.bar.is-best .bar__fill { background: var(--tag); opacity: 1; }
.bar.is-me b { color: var(--leaf); }
.bar__v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .bar { grid-template-columns: 84px minmax(0, 1fr) 70px; font-size: 13px; } }
.tips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; padding: 0; margin: 0; list-style: none; }
@media (max-width: 640px) { .tips { grid-template-columns: minmax(0, 1fr); } }
.tips li { font-size: 14px; padding-left: 14px; border-left: 3px solid var(--tag); }
.tips b { display: block; }

/* Ajustes */
.form { display: grid; gap: 18px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.q__h { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.q__h h2 { font-size: 26px; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; }
.q__h h2 span { font-family: var(--f-mono); font-size: 14px; color: var(--muted); font-weight: 700; }
.q__h p { color: var(--muted); font-size: 14px; flex-basis: 100%; }
.supers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.super { position: relative; display: grid; gap: 2px; text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px; transition: border-color .15s; }
.super:hover { border-color: var(--muted); }
.super b { font-size: 16px; }
.super span { font-size: 12px; color: var(--muted); }
.super[aria-checked="true"] { border-color: var(--leaf); background: var(--leaf-soft); box-shadow: inset 0 0 0 1px var(--leaf); }
.super[aria-checked="true"]::after { content: "✓"; position: absolute; top: 8px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--leaf); color: var(--leaf-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.super .dist { font-weight: 700; color: var(--leaf); }
.cost { letter-spacing: .1em; font-weight: 700; color: var(--ink) !important; }
.cost i { font-style: normal; opacity: .25; }
.geo { font-size: 13.5px; color: var(--muted); }
.steppers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .steppers { grid-template-columns: minmax(0, 1fr); } }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stepper label b { display: block; }
.stepper label span { font-size: 12.5px; color: var(--muted); }
.stepper__ctl { display: flex; align-items: center; gap: 10px; }
.stepper__ctl button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.stepper__ctl output { font-family: var(--f-display); font-stretch: 80%; font-weight: 850; font-size: 28px; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--leaf); background: var(--leaf); color: var(--leaf-ink); }
.field { display: grid; gap: 6px; max-width: 320px; }
.field label { font-weight: 600; font-size: 14px; }
.field select { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 10px 12px; }
.checks { display: grid; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--leaf); }
.check span small { display: block; color: var(--muted); font-size: 12.5px; }
.go { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.dislikes { display: flex; flex-wrap: wrap; gap: 6px; }
.dislikes button { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 10px; font-size: 13px; }

/* Ficha de receta */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 12, .5); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
@media (min-width: 700px) { .overlay { align-items: center; padding: 24px; } }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
@media (min-width: 700px) { .sheet { border-radius: 18px; } }
.sheet__h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.sheet__h h2 { font-size: 30px; text-transform: uppercase; }
.sheet__h p { color: var(--muted); font-size: 14px; margin-top: 6px; }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; flex: none; }
.sheet h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 6px; }
.ings { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; font-size: 14px; }
@media (max-width: 480px) { .ings { grid-template-columns: minmax(0, 1fr); } }
.ings li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding: 4px 0; }
.ings li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14.5px; }
.alts { display: grid; gap: 6px; }
.alt { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 12px; }
.alt:hover { border-color: var(--leaf); }
.alt span { font-weight: 600; font-size: 14px; min-width: 0; }
.alt small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.alt em { font-style: normal; font-weight: 700; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.alt em.down { color: var(--leaf); }
.alt em.up { color: var(--red); }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.disclaimer { font-size: 12.5px; color: var(--muted); margin-top: 26px; max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top gut">
  <div class="wrap">
    <div class="top__row">
      <div class="logo"><b>Menú <span>del Mes</span></b></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#menu" data-view="menu">Menú</a>
      <a href="#compra" data-view="compra">Lista de la compra</a>
      <a href="#resumen" data-view="resumen">Gasto</a>
      <a href="#ajustes" data-view="ajustes">Mis datos</a>
    </nav>
  </div>
</header>

<main class="gut">
  <div class="wrap">
    <section class="view" id="v-menu"></section>

function generate(st, seed) {

}
function itemLine(it, supId) {
  if (it.basic) return { name: it.basic, buy: "1 bote", detail: "Solo si no lo tienes ya en casa" };
  const d = ING[it.ing];
  let buy;
  if (d[7] === "peso") buy = fmtQty(it.packs * d[3], d[2], it.ing) + " a granel";
  else buy = it.packs + " × " + (d[4] || fmtQty(d[3], d[2], it.ing));
  const left = it.packs * d[3] - it.need;
  let detail = "Necesitas " + fmtQty(it.need, d[2], it.ing);
  if (d[7] === "peso") detail += " · " + money(it.unitP / d[3] * 1000) + "/kg";
  else if (left / d[3] > 0.15 && d[6] >= 28) detail += " · te sobra " + fmtQty(left, d[2], it.ing) + " para el mes que viene";
  else if (left / d[3] > 0.25) detail += " · sobra " + fmtQty(left, d[2], it.ing);
  if (it.ing === "pan") detail += " · congela lo que no uses en el día";
  if (it.ing === "merluza") detail += " · va al congelador";
  return { name: itemName(it.ing, supId), buy, detail };
}

const KEY = "menuDelMes.v1";
const now = new Date();
const DEFAULTS = { sup: "mercadona", adults: 2, kids: 2, year: now.getFullYear(), month: now.getMonth(), breakfast: true, fruit: true, bread: false, haveBasics: true, excl: [], disliked: [] };
let state, draft, shopTrip = 0, nearby = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { } }
function load() {

  return null;
}
function fresh(settings, seed, example) {
  const plan = generate(settings, seed);

}

const VIEWS = ["menu", "compra", "resumen", "ajustes"];
function route() {
  let v = (location.hash || "").slice(1);
  if (!VIEWS.includes(v)) v = "menu";
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; });
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (v === "ajustes") { draft = null; renderSettings(); } else render(v);
  window.scrollTo(0, 0);
}
function go(v) { if (location.hash === "#" + v) route(); else location.hash = v; }

function whoText(st) {

function exampleNote() {

let nearbyMsg = "";

/* ============ FICHA DE RECETA ============ */
let sheetCtx = null;
function openSheet(d, meal) {
  const st = state.settings, f = factor(st), day = state.plan.days[d];
  const date = new Date(state.plan.year, state.plan.month, d + 1);
  const when = `${WD[date.getDay()]} ${d + 1} · ${meal === "c" ? "Comida" : meal === "n" ? "Cena" : "Desayuno"}`;
  sheetCtx = { d, meal };
  let h;
  if (meal === "b") {
    const b = BID[day.b];
    h = `<div class="sheet__h"><div><p>${when}</p><h2 id="sheet-title">${esc(b.n)}</h2></div><button class="x" data-act="close" aria-label="Cerrar">✕</button></div>
      <div><h3>Para ${people(st)}</h3><ul class="ings">${Object.keys(b.i).map(k => `<li><span>${ING[k][0]}</span><span>${fmtQty(b.i[k] * f, ING[k][2], k)}</span></li>`).join("")}</ul></div>
      <div><h3>Cómo</h3><ol class="steps">${b.s.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
  } else {
    const r = RID[day[meal]], cost = rCost(r, st.sup) * f;
    const banned = allowedTags(st);
    const alts = RECIPES.filter(x => x.id !== r.id && x.slot.includes(meal) && isAllowed(x, st, banned))
      .map(x => ({ x, c: rCost(x, st.sup) * f, same: x.cat === r.cat }))
      .sort((a, b) => (b.same - a.same) || a.c - b.c).slice(0, 6).sort((a, b) => a.c - b.c);
    h = `<div class="sheet__h"><div><p>${when} · ${CAT_NAME[r.cat]} · ${r.t} min</p><h2 id="sheet-title">${esc(r.n)}</h2></div><button class="x" data-act="close" aria-label="Cerrar">✕</button></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${tag(cost, "para " + people(st))}${tag(cost / f, "por ración")}</div>
      <div><h3>Ingredientes para ${people(st)}</h3><ul class="ings">${Object.keys(r.i).map(k => `<li><span>${ING[k][0]}</span><span>${fmtQty(r.i[k] * f, ING[k][2], k)}</span></li>`).join("")}</ul>
      <p class="muted" style="font-size:13px;margin-top:8px">Además: ${r.b.join(", ")}.</p></div>
      <div><h3>Cómo se hace</h3><ol class="steps">${r.s.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
      <div><h3>Cambiar por otro plato</h3><div class="alts">${alts.map(({ x, c }) => {
        const dlt = c - cost;
        return `<button class="alt" data-swap="${x.id}"><span>${esc(x.n)}<small>${CAT_NAME[x.cat]} · ${x.t} min</small></span><em class="${dlt < 0 ? "down" : "up"}">${dlt < 0 ? "−" : "+"}${money(Math.abs(dlt))}</em></button>`;
      }).join("")}</div></div>
      <div class="btnrow"><button class="btn btn--small" data-act="dislike">No nos gusta: quitarlo del mes</button></div>`;
  }
  $("#sheet").innerHTML = h;
  $("#overlay").hidden = false;
  document.body.style.overflow = "hidden";
  const x = $("#sheet .x"); if (x) x.focus();
}
function closeSheet() { $("#overlay").hidden = true; document.body.style.overflow = ""; sheetCtx = null; }

function bestReplacement(d, meal, avoid) {
  const st = state.settings, banned = allowedTags(st), cur = RID[state.plan.days[d][meal]];
  const near = new Set(); for (let k = Math.max(0, d - 3); k <= Math.min(state.plan.days.length - 1, d + 3); k++) { near.add(state.plan.days[k].c); near.add(state.plan.days[k].n); }
  const c = RECIPES.filter(x => x.id !== avoid && x.slot.includes(meal) && isAllowed(x, st, banned));
  const pref = c.filter(x => !near.has(x.id));
  const list = (pref.length ? pref : c).sort((a, b) => ((b.cat === cur.cat) - (a.cat === cur.cat)) || rCost(a, st.sup) - rCost(b, st.sup));
  return list[0];
}

/* ============ EVENTOS ============ */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

document.addEventListener("click", e => {
  const el = e.target.closest("button, a"); if (!el) { if (e.target.id === "overlay") closeSheet(); return; }
  const ds = el.dataset;
  if (ds.go) { e.preventDefault(); go(ds.go); return; }
  if (ds.trip !== undefined) { shopTrip = +ds.trip; return; }
  if (ds.day !== undefined && ds.meal) { openSheet(+ds.day, ds.meal); return; }
  if (ds.shoptrip !== undefined) { shopTrip = +ds.shoptrip; renderShop(); return; }
  if (ds.swap && sheetCtx) {
    state.plan.days[sheetCtx.d][sheetCtx.meal] = ds.swap; save(); closeSheet(); renderMenu();
    toast("Plato cambiado. La lista de la compra ya está actualizada."); return;
  }
  if (ds.switch) {
    state.settings.sup = ds.switch; state.checks = {}; const s = fresh(state.settings, state.plan.seed, state.example); if (s) state = s; save(); draft = null; render("resumen");
    toast("Lista hecha para " + SUP[ds.switch].name + "."); return;
  }
  if (ds.sup) { draft.sup = ds.sup; renderSettings(); return; }
  if (ds.step) { const k = ds.step, lim = k === "adults" ? [1, 12] : [0, 10]; draft[k] = Math.min(lim[1], Math.max(lim[0], draft[k] + +ds.d)); renderSettings(); return; }
  if (ds.excl) {
    const i = draft.excl.indexOf(ds.excl); if (i >= 0) draft.excl.splice(i, 1); else draft.excl.push(ds.excl); renderSettings(); return;
  }
  if (ds.undislike) { draft.disliked = draft.disliked.filter(x => x !== ds.undislike); renderSettings(); return; }
  switch (ds.act) {
    case "close": closeSheet(); break;
    case "regen": {
      const s = fresh(state.settings, Math.floor(Math.random() * 1e9), state.example); if (s) { state = s; save(); renderMenu(); toast("Menú nuevo. Mira la lista de la compra."); } break;
    }
    case "dislike": {
      if (!sheetCtx) break;
      const id = state.plan.days[sheetCtx.d][sheetCtx.meal];
      state.settings.disliked.push(id); if (draft) draft.disliked = state.settings.disliked.slice();
      state.plan.days.forEach((day, d) => ["c", "n"].forEach(m => { if (day[m] === id) { const r = bestReplacement(d, m, id); if (r) day[m] = r.id; } }));
      save(); closeSheet(); renderMenu(); toast("Quitado del mes. Lo hemos cambiado por otro plato."); break;
    }
    case "uncheck": state.checks = {}; save(); renderShop(); break;
    case "copy": {
      const t = shopping(state.plan, state.settings, state.settings.sup).trips[shopTrip], txt = listText(t, shopTrip);
      const box = $("#copybox");
      const fallback = () => { box.hidden = false; box.value = txt; box.focus(); box.select(); toast("Selecciona el texto y cópialo."); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Lista copiada."), fallback); else fallback();
      break;
    }
    case "geo": findNearby(); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.check) { if (t.checked) state.checks[t.dataset.check] = 1; else delete state.checks[t.dataset.check]; save(); renderShop(); }
  if (t.dataset.opt && draft) draft[t.dataset.opt] = t.checked;
  if (t.id === "month" && draft) { const [y, m] = t.value.split("-").map(Number); draft.year = y; draft.month = m; }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "form") return;
  e.preventDefault();
  const s = fresh(JSON.parse(JSON.stringify(draft)), Math.floor(Math.random() * 1e9), false);
  if (!s) { toast("Con esas restricciones no quedan platos. Quita alguna."); return; }
  state = s; draft = null; save(); shopTrip = 0; go("menu");
  toast("Tu menú de " + MONTHS[state.plan.month] + " está listo.");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeSheet(); });
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeSheet(); });
window.addEventListener("hashchange", route);

/* ============ SUPERMERCADOS CERCANOS (OpenStreetMap) ============ */
function setGeo(msg) { nearbyMsg = msg; const g = $("#geo"); if (g) { g.hidden = false; g.textContent = msg; } }
function findNearby() {
  if (!navigator.geolocation) { setGeo("Tu navegador no deja ver la ubicación. Elige tu súper de la lista."); return; }
  setGeo("Buscando supermercados cerca de ti…");
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    const q = `[out:json][timeout:20];nwr["shop"="supermarket"](around:3000,${lat},${lon});out center 120;`;
    try {
      const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "data=" + encodeURIComponent(q) });
      const js = await res.json(); nearby = {};
      js.elements.forEach(el => {
        const tg = el.tags || {}, txt = ((tg.brand || "") + " " + (tg.name || "")).toLowerCase();
        const la = el.lat ?? (el.center && el.center.lat), lo = el.lon ?? (el.center && el.center.lon); if (la == null) return;
        const s = SUPERS.find(s => s.keys.some(k => new RegExp("(^|[^a-záéíóúñ])" + k + "($|[^a-záéíóúñ])").test(txt))); if (!s) return;
        const R = 6371000, toR = Math.PI / 180, dLa = (la - lat) * toR, dLo = (lo - lon) * toR;
        const a = Math.sin(dLa / 2) ** 2 + Math.cos(lat * toR) * Math.cos(la * toR) * Math.sin(dLo / 2) ** 2;
        const dist = 2 * R * Math.asin(Math.sqrt(a));
        if (nearby[s.id] === undefined || dist < nearby[s.id]) nearby[s.id] = dist;
      });
      const ids = Object.keys(nearby).sort((a, b) => nearby[a] - nearby[b]);
      if (!ids.length) { nearbyMsg = "No he encontrado supermercados de estas cadenas a menos de 3 km. Elige uno de la lista."; renderSettings(); return; }
      draft.sup = ids[0];
      nearbyMsg = `El más cercano es ${SUP[ids[0]].name}. Ya lo he marcado; los demás están ordenados por distancia.`;
      renderSettings();
    } catch (err) { setGeo("No he podido buscar los supermercados ahora mismo. Elige el tuyo de la lista."); }
  }, () => setGeo("Sin permiso para ver tu ubicación. Elige tu súper de la lista."), { timeout: 12000, maximumAge: 600000 });
}

/* ============ ARRANQUE ============ */
state = load() || fresh(JSON.parse(JSON.stringify(DEFAULTS)), 20261101, true);
route();
</script>
