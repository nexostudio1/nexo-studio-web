<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forja App · Demo de app para gimnasio · Nexo Studio</title>
  <meta name="description" content="App de muestra para un gimnasio con entrenamiento personal, diseñada por Nexo Studio. Panel del entrenador con clientes, bonos y cobros, y app del cliente con rutina, reservas y progreso.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="../../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0b0c; --bg-2: #111113; --card: #17171a; --card-2: #1f1f23; --line: #2a2a2f; --text: #f3f3f0; --muted: #a3a3aa; --dim: #6f6f77; --volt: #d4ff3a; --ink: #0b0b0c; --ok: #4ade80; --warn: #ffb23a; --bad: #ff6b5a; --wa: #25d366; --top: 89px; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; font-size: 15px; -webkit-font-smoothing: antialiased; overflow-x: clip; }
    button { font: inherit; color: inherit; }
    h1, h2, h3, .display { font-family: Archivo, Impact, sans-serif; font-stretch: 72%; font-weight: 850; text-transform: uppercase; line-height: .95; margin: 0; letter-spacing: -.005em; }
    p { margin: 0; }
    .volt { color: var(--volt); }
    .muted { color: var(--muted); }

    .demo-bar { position: fixed; z-index: 100; top: 0; left: 0; right: 0; height: 37px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 16px; background: #0b1230; color: #dfe5f7; font-size: 13px; }
    .demo-bar b { color: #fff; }
    .demo-bar > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .demo-bar a { color: #fff; background: linear-gradient(120deg, #19c8ff, #1f5bff); padding: 4px 12px; border-radius: 99px; text-decoration: none; font-weight: 600; white-space: nowrap; }
    @media (max-width: 560px) { .demo-bar { font-size: 12px; gap: 10px; padding: 0 12px; } }

    /* Selector de rol */
    .rolebar { position: fixed; z-index: 90; top: 37px; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 12px; background: #141417; border-bottom: 1px solid var(--line); }
    .rolebar__hint { font-size: 13px; color: var(--muted); }
    .seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
    .seg button { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .2s, color .2s; white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--volt); color: var(--ink); }
    .seg .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--card-2); color: var(--text); }
    .seg button[aria-pressed="true"] .dot { background: var(--ink); color: var(--volt); }
    @media (max-width: 760px) { .rolebar__hint { display: none; } }

    /* Estructura */
    .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; padding-top: var(--top); }
    .side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg-2); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
    .brand__mark { width: 34px; height: 34px; border-radius: 9px; background: var(--volt); color: var(--ink); display: grid; place-items: center; font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 900; font-size: 22px; }
    .brand__txt { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 900; font-size: 22px; text-transform: uppercase; line-height: 1; }
    .brand__txt small { display: block; font-family: Inter, sans-serif; font-stretch: 100%; font-size: 9.5px; font-weight: 600; letter-spacing: .26em; color: var(--muted); margin-top: 3px; }
    .navbtn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; text-align: left; position: relative; transition: background .2s, color .2s; }
    .navbtn:hover { background: var(--card); color: var(--text); }
    .navbtn[aria-current="page"] { background: var(--card-2); color: var(--text); }
    .navbtn[aria-current="page"] svg { color: var(--volt); }
    .navbtn svg { width: 20px; height: 20px; flex: none; }
    .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--volt); color: var(--ink); font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; margin-left: auto; }
    .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
    .me b { display: block; font-size: 14px; }
    .main { padding: 30px clamp(16px, 3vw, 40px) 60px; max-width: 1180px; width: 100%; min-width: 0; }
    .tabbar { display: none; }

    /* Cabecera de vista */
    .vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .vhead h1 { font-size: clamp(38px, 5vw, 56px); }
    .vhead p { color: var(--muted); margin-top: 8px; }
    .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--volt); margin-bottom: 10px; display: block; }

    /* Piezas */
    .grid { display: grid; gap: 14px; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; min-width: 0; }
    .card__h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .card__h h2 { font-size: 24px; }
    .card__h small { color: var(--muted); font-size: 13px; }
    .tile .lbl { font-size: 13px; color: var(--muted); }
    .tile .num { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 850; font-size: 42px; line-height: 1.05; margin-top: 6px; }
    .tile .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .tile .sub b { color: var(--ok); font-weight: 600; }
    .meter { height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin-top: 10px; }
    .meter i { display: block; height: 100%; border-radius: 99px; background: var(--volt); transition: width .6s cubic-bezier(.2, .7, .2, 1); }
    .meter--sm { height: 6px; margin-top: 6px; }
    .meter--warn i { background: var(--warn); }
    .meter--bad i { background: var(--bad); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--card-2); color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; transition: transform .15s, border-color .2s, background .2s; white-space: nowrap; }
    .btn:hover { border-color: #55555c; }
    .btn:active { transform: scale(.97); }
    .btn--volt { background: var(--volt); color: var(--ink); border-color: var(--volt); }
    .btn--volt:hover { background: #e2ff70; border-color: #e2ff70; }
    .btn--wa { background: var(--wa); color: #06210f; border-color: var(--wa); }
    .btn--ghost { background: transparent; }
    .btn--sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
    .btn--block { width: 100%; }
    .btn svg { width: 16px; height: 16px; }

    .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink); flex: none; }
    .av--lg { width: 64px; height: 64px; font-size: 22px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill--ok { color: var(--ok); background: rgba(74, 222, 128, .1); }
    .pill--warn { color: var(--warn); background: rgba(255, 178, 58, .1); }
    .pill--bad { color: var(--bad); background: rgba(255, 107, 90, .1); }
    .pill--plain { color: var(--muted); border-color: var(--line); }
    .pill--plain::before { display: none; }

    /* Agenda */
    .agenda { display: grid; gap: 8px; }
    .slot { display: grid; grid-template-columns: 58px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); transition: opacity .3s, border-color .3s; }
    .slot--next { border-color: var(--volt); }
    .slot--done { opacity: .5; }
    .slot__t { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 850; font-size: 22px; }
    .slot__who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .slot__who b { display: block; font-size: 14.5px; }
    .slot__who div > span { font-size: 12.5px; color: var(--muted); }
    .slot__who > div { min-width: 0; }
    .nowtag { font-size: 11px; font-weight: 700; color: var(--ink); background: var(--volt); padding: 2px 7px; border-radius: 6px; margin-left: 6px; text-transform: uppercase; letter-spacing: .06em; }

    /* Avisos y actividad */
    .alerts, .feed { display: grid; gap: 8px; }
    .alert { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }
    .alert__ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 16px; }
    .alert__ico svg { width: 18px; height: 18px; }
    .alert p { font-size: 14px; flex: 1; min-width: 0; }
    .alert p span { display: block; font-size: 12.5px; color: var(--muted); }
    .feed__it { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; padding: 8px 2px; border-bottom: 1px dashed var(--line); }
    .feed__it:last-child { border-bottom: 0; }
    .feed__it .av { width: 30px; height: 30px; font-size: 11px; }
    .feed__it small { display: block; color: var(--dim); font-size: 12px; }
    .feed__it--new { animation: flash 2.4s ease-out; border-radius: 10px; }
    @keyframes flash { 0% { background: rgba(212, 255, 58, .18); } 100% { background: transparent; } }
    .empty { color: var(--muted); font-size: 14px; padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }

    /* Clientes */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
    .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
    .search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; padding: 11px 0; outline: none; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: var(--card); color: var(--muted); font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); }
    .rows { display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 150px 120px; gap: 16px; align-items: center; padding: 12px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; transition: border-color .2s, transform .15s; }
    .row:hover { border-color: #4a4a51; }
    .row__who { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .row__who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row__who div > span, .row__plan span { font-size: 12.5px; color: var(--muted); }
    .row__plan b { display: block; font-size: 14px; font-weight: 600; }
    .row__bono { font-size: 12.5px; color: var(--muted); }
    .count { color: var(--muted); font-size: 13px; margin-top: 12px; }

    /* Ficha (panel lateral) */
    .scrim { position: fixed; inset: 0; z-index: 120; background: rgba(0, 0, 0, .6); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; z-index: 130; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg-2); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .35s cubic-bezier(.2, .7, .2, 1); overflow-y: auto; padding: 24px; }
    .drawer.open { transform: none; }
    .drawer__close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 20px; line-height: 1; }
    .drawer__head { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; padding-right: 40px; }
    .drawer__head h2 { font-size: 34px; }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .kv > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .kv small { display: block; color: var(--muted); font-size: 12px; }
    .kv b { font-size: 15px; }
    .stack { display: grid; gap: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .note { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #d4d4d8; }
    .note small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }

    /* Gráfica */
    .chart { position: relative; width: 100%; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .tick { fill: var(--dim); font-size: 11px; font-family: Inter, sans-serif; }
    .chart .grid-l { stroke: var(--line); stroke-width: 1; }
    .tip { position: absolute; pointer-events: none; background: #fff; color: var(--ink); font-size: 12.5px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .12s; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .6); }
    .tip b { font-size: 14px; }

    /* Clases */
    .daytabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; padding-bottom: 2px; }
    .daytab { flex: none; min-width: 68px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: center; line-height: 1.15; }
    .daytab small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .daytab b { font-size: 18px; }
    .daytab[aria-pressed="true"] { background: var(--volt); color: var(--ink); border-color: var(--volt); }
    .daytab[aria-pressed="true"] small { color: var(--ink); opacity: .7; }
    .cls { display: grid; grid-template-columns: 70px 1fr 200px auto; gap: 16px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .cls--mine { border-color: var(--volt); }
    .cls__t { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 850; font-size: 24px; }
    .cls__n b { display: block; font-size: 15.5px; }
    .cls__n > span { font-size: 13px; color: var(--muted); }
    .cls__occ { font-size: 12.5px; color: var(--muted); }
    .faces { display: flex; margin-top: 6px; }
    .faces .av { width: 24px; height: 24px; font-size: 9.5px; border: 2px solid var(--card); margin-right: -6px; }

    /* Cliente */
    .hello { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .big-n { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 900; font-size: 84px; line-height: .9; color: var(--volt); }
    .next { background: linear-gradient(150deg, #23281a, var(--card) 70%); border-color: #3b4420; }
    .next__when { font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 850; font-size: 34px; text-transform: uppercase; line-height: 1; margin: 6px 0 4px; }
    .streak { display: flex; gap: 6px; margin-top: 12px; }
    .streak i { flex: 1; height: 34px; border-radius: 8px; background: var(--card-2); }
    .streak i.on { background: var(--volt); }
    .ex { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
    .ex__top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .ex__top b { font-size: 16px; display: block; }
    .ex__top span { font-size: 13px; color: var(--muted); }
    .ex__kg { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .ex__kg input { width: 64px; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; text-align: center; }
    .sets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .set { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; font-weight: 700; color: var(--muted); transition: all .15s; }
    .set[aria-pressed="true"] { background: var(--volt); color: var(--ink); border-color: var(--volt); }
    .ex__tip { margin-top: 12px; font-size: 13px; color: #cfd6b5; background: rgba(212, 255, 58, .06); border-radius: 10px; padding: 8px 12px; }
    .ex__tip b { color: var(--volt); }
    .prog { position: sticky; top: calc(var(--top) + 8px); z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; background: rgba(23, 23, 26, .92); backdrop-filter: blur(10px); border: 1px solid var(--line); margin-bottom: 14px; }
    .prog .meter { flex: 1; margin: 0; }
    .prog b { font-size: 14px; white-space: nowrap; }
    .prs { display: grid; gap: 8px; }
    .pr { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
    .pr:last-child { border-bottom: 0; }
    .pr b { font-size: 15px; }
    .pr .up { color: var(--ok); font-size: 12.5px; font-weight: 600; margin-left: 8px; }
    .inline-form { display: flex; gap: 8px; margin-top: 14px; }
    .inline-form input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text); font: inherit; font-size: 16px; }

    /* Modal WhatsApp */
    .modal { position: fixed; z-index: 140; left: 50%; top: 50%; width: min(440px, calc(100% - 24px)); transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: all .25s cubic-bezier(.2, .7, .2, 1); background: var(--bg-2); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
    .wa__head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1f2c25; }
    .wa__head b { display: block; font-size: 15px; }
    .wa__head span { font-size: 12px; color: #a7c4b4; }
    .wa__body { padding: 18px 16px; background: #0f1a14; }
    .wa__bubble { background: #1d5c3d; border-radius: 14px 14px 4px 14px; padding: 4px; margin-left: 30px; }
    .wa__bubble textarea { width: 100%; min-height: 120px; resize: vertical; border: 0; background: transparent; color: #eafff2; font: inherit; font-size: 15px; padding: 8px 10px; outline: none; }
    .wa__foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 16px; }

    .toast { position: fixed; z-index: 150; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.2, .7, .2, 1); background: var(--text); color: var(--ink); font-weight: 600; font-size: 14px; padding: 12px 18px; border-radius: 14px; width: max-content; max-width: calc(100% - 24px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .7); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .view { animation: fade .35s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } }

    @media (max-width: 1100px) {
      .g4 { grid-template-columns: 1fr 1fr; }
      .row { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 120px; }
      .row > :nth-child(3) { display: none; }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; padding-bottom: 80px; }
      .side { display: none; }
      .main { padding-top: 22px; }
      .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; z-index: 80; left: 0; right: 0; bottom: 0; background: rgba(17, 17, 19, .95); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }

      var w = ME.w, lost = w[0].v - w[w.length - 1].v;
      var html = '<div class="vhead"><div><span class="eyebrow">Progreso</span><h1>Tu evolución.</h1><p>Lo revisas con Álex cada 4 semanas.</p></div></div>';
      html += '<div class="split"><div class="card"><div class="card__h"><h2>Peso corporal</h2><small>kg · semanal</small></div><div class="chart" id="chart"></div><div class="inline-form"><input id="newkg" type="text" inputmode="decimal" autocomplete="off" placeholder="Peso de hoy (kg)" aria-label="Peso de hoy en kilos"><button class="btn btn--volt" data-act="addkg">Añadir</button></div></div>';
      html += '<div class="stack"><div class="card"><div class="card__h"><h2>Resumen</h2><small>desde ' + ME.since + '</small></div><div class="grid g2"><div><div class="display volt" style="font-size:44px">−' + kg(lost) + '</div><span class="muted" style="font-size:13px">kg de peso</span></div><div><div class="display volt" style="font-size:44px">−8</div><span class="muted" style="font-size:13px">cm de cintura</span></div></div></div>';
      html += '<div class="card"><div class="card__h"><h2>Marcas</h2><small>antes → ahora</small></div><div class="prs">' + ME.prs.map(function (p) { var num = typeof p[1] === "number", f = function (v) { return num ? kg(v).replace(",0", "") + " kg" : v; }; return '<div class="pr"><span>' + p[0] + "</span><span><span class=\"muted\">" + f(p[1]) + "</span> → <b>" + f(p[2]) + "</b>" + (num ? '<span class="up">+' + kg(p[2] - p[1]).replace(",0", "") + "</span>" : "") + "</span></div>"; }).join("") + "</div></div>";
      html += '<div class="card"><div class="card__h"><h2>Medidas</h2><small>agosto → hoy</small></div><div class="prs">' + ME.measures.map(function (m) { var u = m[0] === "Grasa corporal" ? " %" : " cm"; return '<div class="pr"><span>' + m[0] + '</span><span><span class="muted">' + m[1] + u + "</span> → <b>" + m[2] + u + "</b></span></div>"; }).join("") + "</div></div></div></div>";
      return html;
    };

    // Ficha del cliente (entrenador)
    function openClient(id) {
      var c = byId(id), d = document.getElementById("drawer");
      var html = '<button class="drawer__close" data-act="close" aria-label="Cerrar">×</button><div class="drawer__head">' + av(c, " av--lg") + "<div><h2>" + c.name + '</h2><span class="muted">' + c.goal + " · socio desde " + c.since + "</span></div></div>";
      html += '<div class="kv"><div><small>Plan</small><b>' + c.plan + "</b></div><div><small>Cuota de " + MONTHS_L[TODAY.getMonth()] + "</small><b>" + eur(c.price) + "</b> " + payPill(c) + "</div><div><small>Última visita</small><b>" + lastTxt(c.last) + "</b></div><div><small>" + (c.type === "pt" ? "Bono" : "Acceso") + "</small><b>" + bonoTxt(c) + "</b>" + (c.type === "pt" ? meter(c.left, c.total, "meter--sm " + bonoMod(c)) : "") + "</div></div>";
      html += '<div class="actions" style="margin-bottom:14px">' + (c.type === "pt" ? '<button class="btn btn--volt" data-act="done" data-id="' + c.id + '"' + (c.left === 0 ? " disabled style=\"opacity:.4\"" : "") + ">" + ICON.check + "Registrar sesión</button>" : "") + '<button class="btn btn--wa" data-act="wa" data-kind="' + (c.paid ? (c.type === "pt" && c.left <= 1 ? "bono" : "hola") : "pago") + '" data-id="' + c.id + '">' + ICON.wa + "WhatsApp</button>" + (!c.paid ? '<button class="btn" data-act="paid" data-id="' + c.id + '">Marcar pagado</button>' : "") + "</div>";
      if (c.w) html += '<div class="card" style="margin-bottom:14px"><div class="card__h"><h2>Peso corporal</h2><small>' + (c.w[c.w.length - 1].v - c.w[0].v > 0 ? "+" : "−") + kg(Math.abs(c.w[c.w.length - 1].v - c.w[0].v)) + ' kg</small></div><div class="chart" id="dchart"></div></div>';
      if (c.note) html += '<div class="note"><small>Notas privadas de Álex</small>' + c.note + "</div>";
      if (!c.w && !c.note) html += '<div class="empty">Socio de cuota sin entrenamiento personal. ¿Le ofreces una sesión de valoración?</div>';
      d.innerHTML = html; d.dataset.id = id;
      d.classList.add("open"); document.getElementById("scrim").classList.add("open");
      if (c.w) lineChart(document.getElementById("dchart"), c.w, "kg");
    }
    function closeAll() { ["drawer", "scrim", "modal"].forEach(function (id) { document.getElementById(id).classList.remove("open"); }); }

    // Mensaje de WhatsApp
    var MONTH = MONTHS_L[TODAY.getMonth()];
    function waText(kind, c) {
      var n = first(c.name);
      if (kind === "bono") return c.left === 0 ? "¡Hola " + n + "! Has terminado tu bono de 8 sesiones 💪 ¿Te lo renuevo para seguir con el plan? Te guardo tu hora de siempre." : "¡Hola " + n + "! Te queda 1 sesión del bono. ¿Te lo renuevo para no cortar el progreso? Te guardo tu hora de siempre 💪";
      if (kind === "pago") return "Hola " + n + ", te escribo de Forja: el recibo de " + MONTH + " (" + eur(c.price) + ") nos ha llegado devuelto. Puedes pagarlo por Bizum o en recepción. ¡Gracias!";
      if (kind === "ina") return "¡Hola " + n + "! Hace " + c.last + " días que no te vemos por Forja. ¿Todo bien? Si quieres te preparo una rutina cortita para retomar 🙂";
      return "¡Hola " + n + "! ";
    }
    function openWA(list, kind, key) {
      var m = document.getElementById("modal"), c = list[0], multi = list.length > 1;
      m.innerHTML = '<div class="wa__head">' + (multi ? '<span class="av" style="background:var(--wa)">' + list.length + "</span>" : av(c)) + "<div><b>" + (multi ? list.length + " socios con pago pendiente" : c.name) + '</b><span>WhatsApp · mensaje preparado</span></div></div><div class="wa__body"><div class="wa__bubble"><textarea id="watext" aria-label="Mensaje">' + esc(multi ? "Hola {nombre}, te escribo de Forja: el recibo de " + MONTH + " nos ha llegado devuelto. Puedes pagarlo por Bizum o en recepción. ¡Gracias!" : waText(kind, c)) + '</textarea></div></div><div class="wa__foot"><button class="btn btn--ghost" data-act="close">Cancelar</button><button class="btn btn--wa" data-act="send">' + ICON.wa + "Enviar" + (multi ? " a " + list.length : "") + "</button></div>";
      m.dataset.key = key || ""; m.dataset.ids = list.map(function (x) { return x.id; }).join(",");
      m.classList.add("open"); document.getElementById("scrim").classList.add("open");
    }

    var toastT;
    function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 3600); }

    // Después de pintar
    var AFTER = {
      clientes: function () {
        var q = document.getElementById("q");
        q.addEventListener("input", function () {
          state.q = q.value;
          var f = state.clientFilter, s = q.value.toLowerCase();
          var list = CLIENTS.filter(function (c) {
            if (s && c.name.toLowerCase().indexOf(s) < 0) return false;
            return f === "todos" || (f === "pt" && c.type === "pt") || (f === "gym" && c.type === "gym") || (f === "pend" && !c.paid) || (f === "renovar" && c.type === "pt" && c.left <= 1);
          });
          document.getElementById("rows").innerHTML = rowsHTML(list);
          document.querySelector(".count").textContent = "Mostrando " + list.length + " de " + SOCIOS + " socios (datos de muestra).";
        });
      },
      progreso: function () { lineChart(document.getElementById("chart"), ME.w, "kg"); },
      rutina: function () {
        document.querySelectorAll("[data-kg]").forEach(function (inp) {
          inp.addEventListener("change", function () { state.laura.kg[state.laura.workoutDay + "_" + inp.dataset.kg] = inp.value; });
        });
      }
    };

    // ---------- Acciones ----------
    function go(view) { state.view[state.role] = view; render(); }
    function markDone(id) {
      var c = byId(id);
      if (c.type === "pt" && c.left > 0) c.left--;
      c.last = 0;
      var s = AGENDA.filter(function (a) { return a.id === id && !a.done; })[0];
      if (s) s.done = true;
      if (id === "laura" && state.laura.next && state.laura.next.di === 0) state.laura.next = null;
      toast("Sesión registrada. A " + first(c.name) + " le quedan " + c.left + " sesiones del bono.");
    }

    document.addEventListener("click", function (e) {
      var t = e.target.closest("button, [data-open]");
      if (!t) { if (e.target.id === "scrim") closeAll(); return; }
      var d = t.dataset, L = state.laura;

      if (d.role && d.role !== state.role) { state.role = d.role; if (d.role === "coach" && state.unseen) { state.view.coach = "hoy"; toast("Tienes " + state.unseen + (state.unseen > 1 ? " novedades" : " novedad") + " de tus clientes en Actividad."); } closeAll(); render(); return; }
      if (d.nav) { closeAll(); go(d.nav); return; }
      if (d.open) { openClient(d.open); return; }
      if (d.filter) { state.clientFilter = d.filter; render(true); return; }
      if (d.cday !== undefined) { state.classDay = +d.cday; render(true); return; }
      if (d.clday !== undefined) { state.clientDay = +d.clday; render(true); return; }
      if (d.ptday !== undefined) { state.ptDay = +d.ptday; render(true); return; }
      if (d.wday !== undefined) { L.workoutDay = +d.wday; L.sets = {}; render(true); return; }
      if (d.set) {
        L.sets[d.set] = !L.sets[d.set]; t.setAttribute("aria-pressed", L.sets[d.set]);
        var w = WORKOUTS[L.workoutDay], tot = 0, dn = 0;
        w.ex.forEach(function (x, i) { tot += x[1]; for (var s = 0; s < x[1]; s++) if (L.sets[i + "_" + s]) dn++; });
        document.getElementById("prog-n").textContent = dn + "/" + tot + " series";
        document.querySelector(".prog .meter i").style.width = (dn / tot * 100) + "%";
        return;
      }
      if (d.pt) {
        var had = L.next; L.next = { di: state.ptDay, t: d.pt };
        pushFeed("laura", "Laura ha " + (had ? "cambiado su sesión 1 a 1 a" : "reservado sesión 1 a 1:") + " <b>" + dayLabel(addDays(state.ptDay)) + " a las " + d.pt + "</b>");
        if (state.ptDay === 0) { AGENDA = AGENDA.filter(function (a) { return a.id !== "laura" || a.done; }); AGENDA.push({ t: d.pt, id: "laura", done: false, kind: "pt" }); }
        else AGENDA = AGENDA.filter(function (a) { return a.id !== "laura" || a.done; });
        toast("Reservado: " + dayLabel(addDays(state.ptDay)) + " a las " + d.pt + ". Álex ya lo tiene en su agenda.");
        render(true); return;
      }

      switch (d.act) {
        case "toast": toast(d.msg); break;
        case "close": closeAll(); break;
        case "goclass": state.classDay = +d.di; go("clases"); break;
        case "done":
          markDone(d.id);
          if (document.getElementById("drawer").classList.contains("open")) openClient(d.id);
          render(true); break;
        case "paid":
          byId(d.id).paid = true; state.handled["pago_" + d.id] = true;
          toast("Pago de " + first(byId(d.id).name) + " registrado.");
          if (document.getElementById("drawer").classList.contains("open")) openClient(d.id);
          render(true); break;
        case "wa": openWA([byId(d.id)], d.kind, d.key); break;
        case "waall": openWA(CLIENTS.filter(function (c) { return !c.paid; }), "pago", "all"); break;
        case "send":
          var m = document.getElementById("modal"), ids = m.dataset.ids.split(",");
          if (m.dataset.key === "all") ids.forEach(function (id) { state.handled["pago_" + id] = true; });
          else if (m.dataset.key) state.handled[m.dataset.key] = true;
          closeAll();
          toast(ids.length > 1 ? "En la app real se enviaría este WhatsApp a " + ids.length + " socios, cada uno con su nombre." : "En la app real se abriría WhatsApp con este mensaje para " + first(byId(ids[0]).name) + ".");
          render(true); break;
        case "book":
          var c = CLASSES.filter(function (x) { return x.id === d.c; })[0];
          c.mine = true; c.booked++;
          pushFeed("laura", "Laura ha reservado <b>" + c.name + "</b> · " + dayLabel(c.date) + " " + c.t);
          toast("¡Plaza reservada! " + c.name + ", " + dayLabel(c.date) + " a las " + c.t + ".");
          render(true); break;
        case "unbook":
          var u = CLASSES.filter(function (x) { return x.id === d.c; })[0];
          u.mine = false; u.booked--;
          var moved = u.wait > 0; if (moved) { u.wait--; u.booked++; }
          pushFeed("laura", "Laura ha cancelado <b>" + u.name + "</b> · " + dayLabel(u.date) + (moved ? " y ha entrado alguien de la lista de espera" : ""));
          toast(moved ? "Cancelada. Tu plaza ya es de alguien de la lista de espera." : "Reserva cancelada.");
          render(true); break;
        case "wait":
          var wc = CLASSES.filter(function (x) { return x.id === d.c; })[0];
          wc.myWait = true; wc.wait++;
          pushFeed("laura", "Laura se ha apuntado a la lista de espera de <b>" + wc.name + "</b>");
          toast("Estás en la lista de espera. Si alguien cancela, te avisamos por WhatsApp.");
          render(true); break;
        case "cancelpt":
          var ns = nextSession();
          L.next = null; AGENDA = AGENDA.filter(function (a) { return a.id !== "laura" || a.done; });
          pushFeed("laura", "Laura ha cancelado su sesión 1 a 1 de <b>" + ns.label + " a las " + ns.t + "</b>");
          toast("Sesión cancelada. No se descuenta del bono.");
          render(true); break;
        case "renew":
          ME.left += 8; ME.total = ME.left > 8 ? ME.left : 8;
          pushFeed("laura", "Laura ha renovado su <b>Bono 8 sesiones</b> (240 €)");
          state.handled["bono_laura"] = true;
          toast("¡Bono renovado! En la app real pagarías aquí con tarjeta o Bizum.");
          render(true); break;
        case "finish":
          var wk = WORKOUTS[L.workoutDay], tt = 0, dd = 0;
          wk.ex.forEach(function (x, i) { tt += x[1]; for (var s = 0; s < x[1]; s++) if (L.sets[i + "_" + s]) dd++; });
          if (!dd) { toast("Marca al menos una serie antes de terminar."); break; }
          ME.last = 0;
          pushFeed("laura", "Laura ha terminado su entreno: <b>" + wk.name + "</b> (" + dd + "/" + tt + " series)");
          L.sets = {};
          toast("¡Entreno guardado! Álex lo verá en su panel.");
          render(true); break;
        case "addkg":
          var inp = document.getElementById("newkg"), v = parseFloat(String(inp.value).replace(",", "."));
          if (!(v >= 30 && v <= 200)) { toast("Escribe un peso válido, por ejemplo 66,8."); inp.focus(); break; }
          ME.w.push({ label: "hoy", v: Math.round(v * 10) / 10 });
          pushFeed("laura", "Laura ha registrado su peso: <b>" + kg(v) + " kg</b>");
          toast("Peso guardado. Le aparece a Álex en tu ficha.");
          render(true); break;
      }
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });
    var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () {
      if (document.getElementById("chart")) lineChart(document.getElementById("chart"), ME.w, "kg");
      var dc = document.getElementById("dchart"); if (dc) lineChart(dc, byId(document.getElementById("drawer").dataset.id).w, "kg");
    }, 150); });

    // Si se abre con #cliente, empieza en la vista de cliente
    if (location.hash === "#cliente") state.role = "client";
    render();
  })();
  </script>
</body>
</html>
